<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NEWS CMS — редактор постов</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0e0f13;--panel:#17181d;--line:#2a2b33;--txt:#e8e8ea;--dim:#8b8b93;--acc:#b8e632}
*{box-sizing:border-box;font-family:system-ui,"Segoe UI",Roboto,sans-serif}
body{margin:0;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button,textarea{background:#202127;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
.acc{background:var(--acc);color:#10130a;border:none;font-weight:600}
main{flex:1;display:flex;min-height:0}
#list{width:320px;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
.post{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;cursor:pointer}
.post.sel{border-color:var(--acc)}
.post .t{font-size:14px;font-weight:600}
.post .m{font-size:11px;color:var(--dim);margin-top:4px}
#editor{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.block img,.block video{max-width:100%;border-radius:6px;background:#000}
.dim{color:var(--dim);font-size:12px}
textarea{min-height:60px;resize:vertical}
#log{height:100px;overflow-y:auto;background:#000;color:#9f9;font-family:monospace;font-size:12px;padding:6px}
</style>
</head>
<body>
<header>
 <b style="color:var(--acc)">NEWS CMS</b>
 <input id="token" type="password" placeholder="GitHub token" size="26">
 <input id="owner" placeholder="owner" size="10">
 <input id="repo" placeholder="repo" size="12">
 <input id="branch" value="main" size="6">
 <button onclick="saveCfg()">Сохранить</button>
 <button onclick="loadFromGithub()">⬇ Загрузить с сервера</button>
 <button class="acc" onclick="publish()">✔ Опубликовать</button>
 <span id="state" class="dim"></span>
</header>
<main>
 <div id="list"></div>
 <div id="editor">
  <div style="display:flex;gap:8px">
   <button onclick="newPost()">+ Новый пост</button>
   <button onclick="delPost()">🗑 Удалить</button>
   <button onclick="movePost(-1)">↑ Выше</button>
  </div>
  <input id="p_title" placeholder="Заголовок новости">
  <div style="display:flex;gap:8px">
   <select id="p_tag"><option>INFO</option><option>PATCH</option><option>UPDATE</option><option>EVENT</option><option>HOTFIX</option></select>
   <input id="p_date" placeholder="дата ДД.ММ.ГГГГ" size="14">
   <input id="p_link" placeholder="ссылка (необязательно)" style="flex:1">
  </div>
  <div class="dim">Блоки поста — текст, фото и видео в любом порядке, как в ТГ:</div>
  <div id="blocks" style="display:flex;flex-direction:column;gap:8px"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button onclick="addText()">+ Текст</button>
   <button onclick="pickFile('image')">+ Фото с диска</button>
   <button onclick="addMediaUrl('image')">+ Фото по URL</button>
   <button onclick="pickFile('video')">+ Видео с диска (.ogv)</button>
   <button onclick="addMediaUrl('video')">+ Видео по URL</button>
  </div>
 </div>
</main>
<div id="log"></div>
<input type="file" id="file" hidden>
<script>
let posts=[], cur=-1, newsSha=null, pickKind='image';
let cfg=JSON.parse(localStorage.cfg||'{}');
const $=id=>document.getElementById(id);
const log=m=>{$('log').innerHTML+=m+'<br>';$('log').scrollTop=1e9};
const raw=p=>`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${p}`;
function api(p,opt){return fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}`,
 Object.assign({headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}},opt));}
function saveCfg(){cfg={token:$('token').value.trim(),owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()};
 localStorage.cfg=JSON.stringify(cfg);log('✔ Настройки сохранены');}
function b64encode(str){return btoa(unescape(encodeURIComponent(str)));}
function b64decode(b64){return new TextDecoder().decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)));}

async function loadFromGithub(){
 if(!cfg.token||!cfg.owner){log('✗ Сначала сохрани настройки');return;}
 $('state').textContent='загрузка...';
 const r=await api('news.json?ref='+cfg.branch);
 if(r.status===404){posts=[];newsSha=null;renderList();newPost();log('news.json не найден — создан пустой список');}
 else if(r.ok){const j=await r.json();newsSha=j.sha;posts=JSON.parse(b64decode(j.content));renderList();if(posts.length)select(0);else newPost();log('✔ Загружено постов: '+posts.length);}
 else log('✗ Ошибка загрузки: '+r.status);
 $('state').textContent='';
}
async function uploadFile(name,b64){
 let sha=null;
 const g=await api('media/'+name+'?ref='+cfg.branch);
 if(g.ok) sha=(await g.json()).sha;
 const r=await api('media/'+name,{method:'PUT',body:JSON.stringify({message:'media: '+name,content:b64,sha:sha||undefined,branch:cfg.branch})});
 if(!r.ok) throw new Error('upload '+r.status);
 return raw('media/'+name);
}
function pickFile(kind){pickKind=kind;$('file').click();}
$('file').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 syncEditor();
 const reader=new FileReader();
 reader.onload=async()=>{
  const b64=reader.result.split(',')[1];
  const name=Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');
  log('⬆ Загружаю '+f.name+' ('+(f.size/1048576).toFixed(1)+' МБ)...');
  try{
   const url=await uploadFile(name,b64);
   posts[cur].content.push({type:pickKind,value:url});
   renderBlocks();log('✔ Файл загружен: '+url);
  }catch(err){log('✗ '+err.message);}
 };
 reader.readAsDataURL(f);
 e.target.value='';
};
function addText(){syncEditor();posts[cur].content.push({type:'text',value:''});renderBlocks();}
function addMediaUrl(kind){syncEditor();const u=prompt('URL файла ('+kind+'):');if(u){posts[cur].content.push({type:kind,value:u.trim()});renderBlocks();}}
function newPost(){syncEditor();posts.unshift({tag:'INFO',date:today(),title:'',link:'',content:[]});cur=0;renderList();fillEditor();}
function delPost(){if(cur<0)return;posts.splice(cur,1);cur=-1;renderList();if(posts.length)select(0);else clearEditor();}
function movePost(d){syncEditor();const j=cur+d;if(j<0||j>=posts.length)return;[posts[cur],posts[j]]=[posts[j],posts[cur]];cur=j;renderList();}
function today(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}
function renderList(){
 $('list').innerHTML='';
 posts.forEach((p,i)=>{
  const el=document.createElement('div');
  el.className='post'+(i===cur?' sel':'');
  el.innerHTML='<div class="t">'+(p.title||'(без заголовка)')+'</div><div class="m">'+p.tag+' · '+p.date+' · блоков: '+(p.content||[]).length+'</div>';
  el.onclick=()=>select(i);
  $('list').appendChild(el);
 });
}
function select(i){syncEditor();cur=i;renderList();fillEditor();}
function clearEditor(){$('p_title').value='';$('p_link').value='';$('p_date').value='';$('blocks').innerHTML='';}
function fillEditor(){
 const p=posts[cur];if(!p){clearEditor();return;}
 $('p_title').value=p.title||'';$('p_tag').value=p.tag||'INFO';$('p_date').value=p.date||'';$('p_link').value=p.link||'';
 renderBlocks();
}
function renderBlocks(){
 const p=posts[cur];if(!p)return;
 const box=$('blocks');box.innerHTML='';
 (p.content||[]).forEach((b,i)=>{
  const el=document.createElement('div');el.className='block';
  const row=document.createElement('div');row.className='dim';
  row.textContent='#'+(i+1)+' '+b.type+' ';
  const up=document.createElement('button');up.textContent='↑';up.onclick=()=>{syncEditor();if(i>0){[p.content[i],p.content[i-1]]=[p.content[i-1],p.content[i]];renderBlocks();}};
  const del=document.createElement('button');del.textContent='🗑';del.onclick=()=>{syncEditor();p.content.splice(i,1);renderBlocks();};
  row.appendChild(up);row.appendChild(del);el.appendChild(row);
  if(b.type==='text'){
   const ta=document.createElement('textarea');ta.value=b.value;ta.oninput=()=>b.value=ta.value;el.appendChild(ta);
  }else{
   const prev=document.createElement(b.type==='image'?'img':'video');
   prev.src=b.value;if(b.type==='video')prev.controls=true;
   prev.onerror=()=>{prev.replaceWith(Object.assign(document.createElement('div'),{className:'dim',textContent:'⚠ предпросмотр недоступен: '+b.value}));};
   el.appendChild(prev);
   const inp=document.createElement('input');inp.value=b.value;inp.oninput=()=>b.value=inp.value;el.appendChild(inp);
  }
  box.appendChild(el);
 });
}
function syncEditor(){
 if(cur<0||!posts[cur])return;
 posts[cur].title=$('p_title').value;posts[cur].tag=$('p_tag').value;
 posts[cur].date=$('p_date').value;posts[cur].link=$('p_link').value;
}
async function publish(){
 syncEditor();
 const clean=posts.map(p=>{
  const o={tag:p.tag,date:p.date,title:p.title,content:(p.content||[]).filter(b=>b.value&&b.value.trim())};
  if(p.link)o.link=p.link;
  return o;
 });
 const r=await api('news.json',{method:'PUT',body:JSON.stringify({message:'news: publish '+clean.length+' posts',content:b64encode(JSON.stringify(clean,null,2)),sha:newsSha||undefined,branch:cfg.branch})});
 if(r.ok){newsSha=(await r.json()).content.sha;log('✔ Опубликовано постов: '+clean.length);$('state').textContent='опубликовано '+new Date().toLocaleTimeString();}
 else log('✗ Ошибка публикации: '+r.status+' '+await r.text());
}
window.onload=()=>{$('token').value=cfg.token||'';$('owner').value=cfg.owner||'';$('repo').value=cfg.repo||'';$('branch').value=cfg.branch||'main';log('Готов. Введи токен и данные репозитория → Сохранить → Загрузить с сервера.');};
</script>
</body>
</html>
